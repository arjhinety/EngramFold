[project]
name = "engramfold"
version = "0.0.1"
description = "Research integrity infrastructure for the EngramFold project."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "EngramFold contributors" }]
# The core has no third-party dependencies on purpose. Everything the integrity
# substrate does -- hashing, manifests, freezes, provenance, validation -- must run
# on a bare interpreter, because a validation gate that cannot run is a validation
# gate that silently does not run. PyYAML and jsonschema are optional and only used
# where a format genuinely needs them.
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11", "pyyaml>=6.0", "types-PyYAML>=6.0"]

[project.scripts]
engramfold = "engramfold.cli.main:main"
engramfold-validate = "engramfold.registry.validate:main"
engramfold-preflight = "engramfold.preflight:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engramfold"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "."]
markers = [
  "gitslow: exercises real `git` subprocesses against a temporary repository",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RET", "PTH", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests assert on frozen literals and build adversarial fixtures; several stylistic
# rules fight that directly.
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/engramfold"]